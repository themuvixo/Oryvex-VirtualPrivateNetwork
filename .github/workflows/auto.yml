name: auto

on:
  push:
    branches:
      - main
      - master

permissions:
  actions: write
  contents: read

jobs:
  dispatch-workflows:
    name: Start CI, app builds, and Pages after each push
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the push workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$REF"
          gh workflow run apps.yml --repo "$REPOSITORY" --ref "$REF"
          gh workflow run pages.yml --repo "$REPOSITORY" --ref "$REF"