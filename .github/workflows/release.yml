name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # macOS + Windows desktop targets, always on the latest runners.
  # macOS uses macos-latest (Apple Silicon); the Intel/x86_64 binary
  # is cross-compiled from that same runner.
  # Windows uses windows-latest for x86_64. The arm64 MSVC target is not
  # built: it has never been verified on a real arm64 Windows machine.
  #
  # Every leg builds the pluggable transports first and ships them in a
  # pt/ folder beside the binary, so tor works out of the box with
  # nothing for anyone to install by hand.
  #
  # Every leg also ships a LICENSES/ folder beside the binary: oryvexcore's
  # license, the license files of lyrebird and psiphon-tunnel-core from
  # the sources the scripts build, lyrebird-THIRD-PARTY-NOTICES.txt and
  # psiphon-tunnel-core-THIRD-PARTY-NOTICES.txt, which the scripts write
  # from `go list -deps` for the Go standard library and modules linked
  # into each, and THIRD-PARTY-NOTICES.txt, which third-party-notices.py
  # writes from `cargo metadata` and `cargo tree` for the Rust standard
  # library and the Rust crates linked into oryvexcore with the target and
  # features of the build.
  # ------------------------------------------------------------------
  desktop:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            archive: oryvexcore-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            archive: oryvexcore-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            archive: oryvexcore-windows-x86_64.zip
    defaults:
      run:
        working-directory: oryvexcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: bash scripts/pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        shell: bash
        run: bash scripts/psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        shell: bash
        run: bash scripts/build-core.sh cargo build --release --target ${{ matrix.target }}

      - name: Collect licenses
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          "$py" scripts/third-party-notices.py --target ${{ matrix.target }} --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  oryvexcore pt LICENSES

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force pt target/${{ matrix.target }}/release/pt
          Copy-Item -Recurse -Force LICENSES target/${{ matrix.target }}/release/LICENSES
          Compress-Archive -Path target/${{ matrix.target }}/release/oryvexcore.exe,target/${{ matrix.target }}/release/pt,target/${{ matrix.target }}/release/LICENSES,run-oryvexcore.bat -DestinationPath ${{ matrix.archive }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: oryvexcore/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux targets, built inside the latest Fedora container.
  # x86_64 builds on an x86_64 runner and arm64 on a native arm64
  # runner, both using fedora:latest so binaries link against a fresh
  # Fedora toolchain. Rust is installed via rustup to guarantee the
  # latest stable, as every other job builds with.
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            archive: oryvexcore-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            archive: oryvexcore-linux-arm64.tar.gz
    defaults:
      run:
        working-directory: oryvexcore
    steps:
      - name: Install system dependencies (Fedora)
        working-directory: /
        run: |
          dnf -y install \
            gcc gcc-c++ make cmake ninja-build golang nasm clang \
            perl perl-FindBin perl-IPC-Cmd \
            curl git tar gzip xz unzip findutils which python3 diffutils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (latest stable via rustup)
        working-directory: /
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build pluggable transports
        run: bash scripts/pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash scripts/psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        run: bash scripts/build-core.sh cargo build --release --target ${{ matrix.target }}

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python3 scripts/third-party-notices.py --target ${{ matrix.target }} --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  oryvexcore pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: oryvexcore/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM (Raspberry Pi 2/3 class and older ARM boards).
  # Cross-compiled on the latest Ubuntu runner with the gnueabihf
  # toolchain, which ships the glibc hard-float cross compiler that
  # Fedora does not package cleanly. Best-effort, never blocks release.
  # ------------------------------------------------------------------
  linux-armv7:
    name: Build oryvexcore-linux-armv7.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oryvexcore
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build pluggable transports
        run: bash scripts/pt-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build psiphon
        run: bash scripts/psiphon-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build release binary
        run: bash scripts/build-core.sh cargo build --release --target armv7-unknown-linux-gnueabihf

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python3 scripts/third-party-notices.py --target armv7-unknown-linux-gnueabihf --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-gnueabihf/release/pt
          cp -R LICENSES target/armv7-unknown-linux-gnueabihf/release/LICENSES
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../oryvexcore-linux-armv7.tar.gz oryvexcore pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oryvexcore-linux-armv7.tar.gz
          path: oryvexcore/oryvexcore-linux-armv7.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM musl, fully static (OpenWrt routers and other musl-based
  # Linux systems). Built directly on the runner rather than with
  # `cross`/Docker: this repo isn't a single cargo workspace (oryvexcore
  # depends on vendor/quiche via path deps, and quiche has its own
  # [workspace]), and cross's container only mounts the crate being
  # built, so it can't see the referenced workspace root. Building on
  # the runner avoids that entirely.
  #
  # The musl toolchain comes from AmanoTeam/musl-gcc-cross's GitHub
  # release, not musl.cc, which blocks all requests from GitHub
  # Actions runners. Note the release asset is named by *host*
  # architecture, not target: x86_64-unknown-linux-gnu.tar.xz is the
  # x86_64-hosted toolchain that contains cross-compilers for every
  # target musl-gcc-cross supports, including armv7-musleabihf.
  #
  # boring-sys uses bindgen (backed by clang) to generate BoringSSL
  # bindings. Without BINDGEN_EXTRA_CLANG_ARGS pointing it at the musl
  # sysroot, clang falls back to the host's glibc headers, which don't
  # exist in the same layout musl expects (missing bits/libc-header-start.h).
  #
  # RUST_LIBC_UNSTABLE_MUSL_V1_2_3 tells the libc crate that this is a
  # modern musl (1.2.x, 64-bit time_t on 32-bit targets). Without it,
  # libc assumes the old 32-bit time_t, which doesn't match what
  # bindgen sees in the real (1.2.x) sysroot headers, and boring fails
  # to build with type mismatches on ASN1_TIME_set/X509_VERIFY_PARAM_set_time.
  # ------------------------------------------------------------------
  linux-armv7-musl:
    name: Build oryvexcore-linux-armv7-musl.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oryvexcore
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CC_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CXX_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-g++
      AR_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-ar
      BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_musleabihf: --target=armv7-unknown-linux-musleabihf --sysroot=/opt/musl-cross/armv7-unknown-linux-musleabihf
      RUSTFLAGS: --cfg libc_unstable_musl_v1_2_3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Install kernel uapi headers into the musl sysroots
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz -o /tmp/linux.tar.xz
          mkdir -p /tmp/ksrc && tar -C /tmp/ksrc --strip-components=1 -xf /tmp/linux.tar.xz
          for inc in /opt/musl-cross/*/include; do
            [ -d "$inc" ] || continue
            case "$inc" in
              *aarch64*) karch=arm64 ;;
              *armv7*|*armhf*|*arm-linux*) karch=arm ;;
              *x86_64*) karch=x86 ;;
              *) karch= ;;
            esac
            [ -z "$karch" ] && continue
            rm -rf /tmp/hdr-$karch
            make -s -C /tmp/ksrc ARCH=$karch INSTALL_HDR_PATH=/tmp/hdr-$karch headers_install
            sudo cp -rn /tmp/hdr-$karch/include/. "$inc/"
          done
          echo "=== uapi check ==="; for inc in /opt/musl-cross/*/include; do echo "$inc:"; ls "$inc/linux/random.h" "$inc/asm/types.h" 2>&1 | sed 's/^/    /'; done

      - name: Build pluggable transports
        run: bash scripts/pt-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build psiphon
        run: bash scripts/psiphon-build.sh linux arm "$PWD/pt" 7 "$PWD/LICENSES"

      - name: Build release binary
        run: bash scripts/build-core.sh cargo build --release --target armv7-unknown-linux-musleabihf

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python3 scripts/third-party-notices.py --target armv7-unknown-linux-musleabihf --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-musleabihf/release/pt
          cp -R LICENSES target/armv7-unknown-linux-musleabihf/release/LICENSES
          cd target/armv7-unknown-linux-musleabihf/release
          tar -czf ../../../oryvexcore-linux-armv7-musl.tar.gz oryvexcore pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oryvexcore-linux-armv7-musl.tar.gz
          path: oryvexcore/oryvexcore-linux-armv7-musl.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 64-bit x86 and arm64 musl, fully static. x86_64 covers OpenWrt on
  # x86_64 routers/boxes and any generic musl-based x86_64 Linux.
  # aarch64 covers OpenWrt on arm64 routers and Raspberry Pi 4/5 running
  # a musl userland. Same toolchain source and same bindgen/libc env
  # var fixes as linux-armv7-musl above, just different target triples.
  # ------------------------------------------------------------------
  linux-musl:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oryvexcore
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross_prefix: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            archive: oryvexcore-linux-x86_64-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            cross_prefix: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            archive: oryvexcore-linux-aarch64-musl.tar.gz
    env:
      RUST_LIBC_UNSTABLE_MUSL_V1_2_3: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Install kernel uapi headers into the musl sysroots
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz -o /tmp/linux.tar.xz
          mkdir -p /tmp/ksrc && tar -C /tmp/ksrc --strip-components=1 -xf /tmp/linux.tar.xz
          for inc in /opt/musl-cross/*/include; do
            [ -d "$inc" ] || continue
            case "$inc" in
              *aarch64*) karch=arm64 ;;
              *armv7*|*armhf*|*arm-linux*) karch=arm ;;
              *x86_64*) karch=x86 ;;
              *) karch= ;;
            esac
            [ -z "$karch" ] && continue
            rm -rf /tmp/hdr-$karch
            make -s -C /tmp/ksrc ARCH=$karch INSTALL_HDR_PATH=/tmp/hdr-$karch headers_install
            sudo cp -rn /tmp/hdr-$karch/include/. "$inc/"
          done
          echo "=== uapi check ==="; for inc in /opt/musl-cross/*/include; do echo "$inc:"; ls "$inc/linux/random.h" "$inc/asm/types.h" 2>&1 | sed 's/^/    /'; done

      - name: Set up cross env vars
        run: |
          triple=$(echo "${{ matrix.target }}" | tr '-' '_')
          prefix=/opt/musl-cross/bin/${{ matrix.cross_prefix }}
          echo "CARGO_TARGET_${triple^^}_LINKER=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CC_${triple}=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${triple}=${prefix}-g++" >> "$GITHUB_ENV"
          echo "AR_${triple}=${prefix}-ar" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_${triple}=--target=${{ matrix.target }} --sysroot=/opt/musl-cross/${{ matrix.cross_prefix }}" >> "$GITHUB_ENV"

      - name: Build pluggable transports
        run: bash scripts/pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash scripts/psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary
        run: bash scripts/build-core.sh cargo build --release --target ${{ matrix.target }}

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python3 scripts/third-party-notices.py --target ${{ matrix.target }} --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }} oryvexcore pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: oryvexcore/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android / Termux targets, built with the NDK via cargo-ndk on the
  # latest Ubuntu runner (the NDK cross toolchain, not the host libc,
  # determines the output). The binary is built for Android 10 (API 29)
  # and later, the level PattNG builds oryvexcore, hev-socks5-tunnel and
  # libv2ray for.
  #
  # The transports are built as static GOOS=linux binaries rather than
  # GOOS=android: android needs cgo, while a CGO_ENABLED=0 linux ELF
  # runs as-is under Android and Termux.
  # ------------------------------------------------------------------
  android:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            goarch: arm64
            goarm: ""
            archive: oryvexcore-android-arm64.tar.gz
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            goarch: arm
            goarm: "7"
            archive: oryvexcore-android-armv7.tar.gz
          - abi: x86_64
            target: x86_64-linux-android
            goarch: amd64
            goarm: ""
            archive: oryvexcore-android-x86_64.tar.gz
    defaults:
      run:
        working-directory: oryvexcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build pluggable transports
        run: bash scripts/pt-build.sh linux ${{ matrix.goarch }} "$PWD/pt" "${{ matrix.goarm }}" "$PWD/LICENSES"

      - name: Build psiphon
        run: bash scripts/psiphon-build.sh linux ${{ matrix.goarch }} "$PWD/pt" "${{ matrix.goarm }}" "$PWD/LICENSES"

      - name: Build release binary
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          under=$(echo "${{ matrix.target }}" | tr '-' '_')
          export "BORING_BSSL_RUST_CPPLIB_${under}=static:-bundle=c++"
          bash scripts/build-core.sh cargo ndk -t ${{ matrix.abi }} --platform 29 build --release
          bin="target/${{ matrix.target }}/release/oryvexcore"
          needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "[android ${{ matrix.abi }}] oryvexcore NEEDED: $needed"
          if grep -qx 'libc++_shared.so' <<<"$needed"; then
            echo "ERROR: oryvexcore still needs libc++_shared.so (static libc++ link failed)"; exit 1
          fi

      - name: Collect licenses
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python3 scripts/third-party-notices.py --target ${{ matrix.target }} --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cp -R LICENSES target/${{ matrix.target }}/release/LICENSES
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  oryvexcore pt LICENSES

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: oryvexcore/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Collect every artifact, generate SHA-256 checksums and publish.
  # Runs even if some build legs failed, so one broken target never
  # blocks shipping the ones that succeeded.
  # ------------------------------------------------------------------
  # Android APKs, the Flutter Windows app and OryvexVPN Lite (Windows 7/8, 32/64-bit).
  apps:
    name: GUI apps
    uses: ./.github/workflows/apps.yml
    secrets: inherit

  release:
    name: Publish release
    needs: [desktop, linux, linux-armv7, linux-armv7-musl, linux-musl, android, apps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oryvexcore-*
          path: dist
          merge-multiple: true

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OryvexVPN-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip *.apk *.exe)
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
          body: |
            OryvexVPN ${{ github.ref_name }}

            New: SSTP is gone; Tor is a route of its own on Android and Windows, with Auto, Fastest or a chosen exit country.

            GUI apps (blue and black):
            - Android 5.0+: OryvexVPN-android-arm64-v8a.apk (most phones), -armeabi-v7a.apk (older / low-end), -x86_64.apk, or -universal.apk.
            - Windows 10/11 64-bit: OryvexVPN-Setup-<version>-x64.exe (installer: Program Files, desktop icon, Start menu), or OryvexVPN-windows-x64.zip (portable, run OryvexVPN.exe).
            - Windows 7/8/10/11 32-bit and 64-bit: OryvexVPN-windows-legacy-x86.zip / -x64.zip (OryvexVPN Lite).

            Command-line core archives for Linux, macOS, Windows, OpenWrt and Termux are attached too, each with a .sha256; SHA256SUMS.txt lists them all.

            Created by Muvixo. Free software under the AGPL-3.0.

  # ------------------------------------------------------------------
  # Build and push the Docker image to GitHub Container Registry (GHCR)
  # ------------------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    # Only a release pushes the image: a manual run from a branch is a build check
    # and must not move the "latest" tag.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requires repository names to be strictly lowercase.
      # The repository name may contain uppercase, so lowercase it here.
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
