[package]
name = "oryvexcore-lite"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "OryvexVPN Lite: a tiny native Win32 GUI for the OryvexCore core, for Windows 7/8/10/11, 32- and 64-bit."
publish = false

# Not part of any workspace: the core lives in ../oryvexcore with its own lockfile.
[workspace]

[[bin]]
name = "OryvexVPNLite"
path = "src/main.rs"

[dependencies]

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
