name: oryvex_shared
description: "Shared UI, theme, fonts and core control for the OryvexVPN desktop and Android apps."
publish_to: 'none'
version: 2.5.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/logo.svg
    - assets/logo-mark.svg
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: fonts/InterDisplay-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
