<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OryvexVPN</title>
  <!-- OryvexVPN: the open orbit. Same geometry as the in-app Connect orb: gap centred at
       the upper right (-45deg), the core parked just outside the ring, on its way out. -->
  <defs>
    <linearGradient id="oxTile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B83FF"/>
      <stop offset="1" stop-color="#0656E6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#oxTile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  <path d="M358.52,241.36 A114,114 0 1,1 270.64,153.48" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/><circle cx="358.72" cy="153.28" r="32" fill="#FFFFFF"/>
</svg>
